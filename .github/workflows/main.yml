name: Rust CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write
  actions: read
  security-events: write

concurrency:
  # Master runs publish releases and the Docker image, so they queue instead of cancelling
  # each other halfway through a publish; other branches only need their newest run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update Rust toolchain to stable
        run: |
          rustup override set stable
          rustup update stable
          rustup component add rustfmt
      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1

  deps:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update Rust toolchain to stable
        run: |
          rustup override set stable
          rustup update stable
      - name: Machete
        uses: bnjbvr/cargo-machete@7959c845782fed02ee69303126d4a12d64f1db18

  audit:
    name: Audit
    runs-on: ubuntu-latest
    # rustsec/audit-check reports warnings (e.g. yanked crates) as a check run.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - name: Update Rust toolchain to stable
        run: |
          rustup override set stable
          rustup update stable
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update Rust toolchain to stable
        run: |
          rustup override set stable
          rustup update stable
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: typos-cli
      - name: Typos Check
        run: typos src/

  lint:
    name: Lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-cache-${{ runner.os }}-${{ runner.arch }}-stable"
      - name: Update Rust toolchain to stable
        run: |
          rustup override set stable
          rustup update stable
          rustup target add ${{ matrix.target }}
          rustup component add clippy
      - name: Cargo Clippy (Deny Warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-cache-${{ runner.os }}-${{ runner.arch }}-stable"
      - name: Update Rust toolchain to stable
        run: |
          rustup override set stable
          rustup update stable
          rustup target add ${{ matrix.target }}
      - name: Run tests
        run: cargo test --locked

  shellcheck-installer:
    name: Shellcheck Installer Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master

  powershell-analyzer:
    name: PowerShell Analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: lint
        uses: devblackops/github-action-psscriptanalyzer@master
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          failOnWarnings: 'false'
          sendComment: 'false'

  build:
    name: Build
    needs: [ fmt, deps, audit, typos, lint, test, shellcheck-installer, powershell-analyzer ]
    strategy:
      fail-fast: false
      matrix:
        include:
          # The binary needs the build runner's glibc or newer: 22.04's (2.35) also runs on
          # Ubuntu 22.04 and Debian 12, where a 24.04 build (2.38) doesn't start. The asset
          # keeps its name, which the installers and the self-updater look for.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary_name: dtv-ingest
            asset_name: dtv-ingest-ubuntu-latest
          - platform: windows-latest
            target: x86_64-pc-windows-gnu
            binary_name: dtv-ingest.exe
            asset_name: dtv-ingest-windows-latest.exe
    runs-on: ${{ matrix.platform }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Fetch full history for proper versioning
      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Per runner image, not shared with lint and test on ubuntu-latest: C code compiled
          # against a newer glibc's headers doesn't link on ubuntu-22.04.
          shared-key: "build-${{ matrix.platform }}-${{ runner.arch }}-stable"
      - name: Update Rust toolchain
        run: |
          rustup override set stable
          rustup update stable
          rustup target add ${{ matrix.target }}
      - name: Generate version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -n 1 | sed -e 's/version = "//' -e 's/"//')
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="v${CARGO_VERSION}"
          VERSION_SHA="v${CARGO_VERSION}-${SHORT_SHA}"
          EXISTING_TAGS=$(gh release list --repo ${{ github.repository }} --limit 1000 --json tagName -q '.[].tagName' || echo "")
          if echo "$EXISTING_TAGS" | grep -x "$VERSION"; then
            echo "Release for version $VERSION already exists. Creating a pre-release."
            echo "version=$VERSION_SHA" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Prepare binary (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.asset_name }}
          # The memory helper install-linux.sh sets up; its name must not contain "ubuntu-latest".
          cp target/${{ matrix.target }}/release/dtv-ingest-memgrant dtv-ingest-memgrant-linux
          chmod +x ${{ matrix.asset_name }} dtv-ingest-memgrant-linux
          ls -la ${{ matrix.asset_name }} dtv-ingest-memgrant-linux
      - name: Prepare binary (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          copy target\${{ matrix.target }}\release\${{ matrix.binary_name }} ${{ matrix.asset_name }}
          # Same exe; the "-setup" name makes it install itself when double-clicked
          copy target\${{ matrix.target }}\release\${{ matrix.binary_name }} dtv-ingest-setup.exe
          Get-Item ${{ matrix.asset_name }}, dtv-ingest-setup.exe
      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 1
      - name: Upload memory helper artifact (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v5
        with:
          name: dtv-ingest-memgrant-linux
          path: dtv-ingest-memgrant-linux
          retention-days: 1
      - name: Upload Windows installer artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v5
        with:
          name: dtv-ingest-setup.exe
          path: dtv-ingest-setup.exe
          retention-days: 1

  windows-smoke:
    name: Windows Smoke Test
    # Tests the exact exe that gets released instead of building another one.
    needs: [ build ]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: Download release exe
        uses: actions/download-artifact@v6
        with:
          name: dtv-ingest-windows-latest.exe
          path: build
      - name: Installer, status window and console flash
        shell: pwsh
        run: .github/scripts/windows-smoke.ps1 -Exe build/dtv-ingest-windows-latest.exe -OutDir windows-smoke
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-smoke-screenshots
          path: windows-smoke
          retention-days: 7

  release:
    name: Create Release
    needs: [ build, windows-smoke ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      # For the build provenance attestation of the release files
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v5
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./artifacts
      - name: Prepare release assets
        run: |
          mkdir -p ./release-assets
          find ./artifacts -name "dtv-ingest-*" -type f -exec cp {} ./release-assets/ \;
          cp install-linux.sh install-windows.ps1 ./release-assets/
          (cd ./release-assets && sha256sum * > SHA256SUMS)
          ls -la ./release-assets/
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: ./release-assets/*
      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.build.outputs.version }}
          # Without it the tag goes on master's head at release time, not on the commit built.
          target_commitish: ${{ github.sha }}
          name: |
            ${{ needs.build.outputs.is_prerelease == 'true' && 'Nightly - ' || '' }}DTV Ingest ${{ needs.build.outputs.version }}
          body: |
            ## Installation

            **Windows :** télécharge et lance [dtv-ingest-setup.exe](https://github.com/DTV-GG/dtv-ingest/releases/download/${{ needs.build.outputs.version }}/dtv-ingest-setup.exe). Pas besoin des droits administrateur.

            **Linux :**
            ```bash
            curl -fsSL https://github.com/DTV-GG/dtv-ingest/releases/download/${{ needs.build.outputs.version }}/install-linux.sh | bash
            ```
            Sans curl (Ubuntu de base n'a que wget) :
            ```bash
            wget -O- https://github.com/DTV-GG/dtv-ingest/releases/download/${{ needs.build.outputs.version }}/install-linux.sh | bash
            ```

            Puis colle le jeton de ton profil sur https://dtv.gg dans la fenêtre de l'appli.

            Commit ${{ github.sha }}
          files: |
            ./release-assets/*
            ./README.md
          draft: false
          prerelease: ${{ needs.build.outputs.is_prerelease }}
          make_latest: true
